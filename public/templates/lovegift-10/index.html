<body>
    <!-- Rose Intro (warp tunnel) -->
    <div class="rose-intro" id="roseIntro">
        <div class="rose-bouquet" id="roseBouquet">
            <img src="images/rose3.png" class="bouquet-rose r1" alt="">
            <img src="images/rose1.png" class="bouquet-rose r2" alt="">
            <img src="images/rose5.png" class="bouquet-rose r3" alt="">
            <img src="images/rose2.png" class="bouquet-rose r4" alt="">
            <img src="images/rose4.png" class="bouquet-rose r5" alt="">
            <img src="images/rose6.png" class="bouquet-rose r6" alt="">
            <img src="images/rose1.png" class="bouquet-rose r7" alt="">
        </div>
        <p class="bouquet-hint">Chạm vào hoa hồng...</p>
        <div class="rose-warp" id="roseWarp"></div>
    </div>

    <!-- Main Content -->
    <div class="main-content hidden">
        <!-- Envelope Wrapper -->
        <div class="envelope-wrapper" id="envelopeWrapper">
            <!-- Card (starts inside envelope) -->
            <div class="card" id="card">
                <div class="card-inner">
                    <div class="card-cover">
                        <h1 class="card-title">
                            <span class="card-title-secondary">Dear</span>
                            <span class="card-title-main">My Love</span>
                            <span class="card-title-secondary">&#10084;</span>
                        </h1>
                    </div>
                    <div class="card-back"></div>
                </div>
                <div class="card-body">
                    <p class="card-greeting">Gửi anh yêu,</p>
                    <p class="card-message">Từ ngày có anh, cuộc sống của em trở nên tươi đẹp hơn bao giờ hết. Cảm ơn anh vì đã luôn ở bên em, yêu thương và che chở cho em.</p>
                    <p class="card-ending">Yêu anh nhiều lắm!</p>
                </div>
            </div>

            <!-- Envelope -->
            <div class="envelope" id="envelope">
                <!-- Back of envelope -->
                <div class="envelope-back"></div>
                <!-- Lid (flap) -->
                <div class="envelope-lid"></div>
                <!-- Front of envelope -->
                <div class="envelope-front"></div>
                <!-- Heart seal -->
                <div class="heart-seal"></div>
            </div>
        </div>

        <!-- Click Instruction -->
        <p class="click-instruction" id="clickInstruction">Click vào bức thư để mở</p>
    </div>

    <!-- Flying Hearts (generated by JavaScript) -->
    <div class="flying-hearts-container" id="flyingHearts"></div>

    <!-- Modal -->
    <div id="wishModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div class="polaroid-card">
                <div class="polaroid-image">
                    <img src="" alt="Love">
                </div>
                <div class="polaroid-text">
                    <h2></h2>
                    <p></p>
                    <p></p>
                    <p class="signature"></p>
                </div>
                <!-- Heart button cuối thư -->
                <div class="heart-close-btn" id="heartCloseBtn" onclick="onHeartTap()">
                    <img src="heart.png" alt="Heart">
                </div>
            </div>
        </div>
    </div>

    <!-- Container cho ảnh bay lên -->
    <div class="flying-images-container" id="flyingImages"></div>

    <!-- Background Music -->
    <audio id="bgMusic" loop></audio>

    <!-- Music Control Button -->
    <button id="musicToggle" class="music-toggle" onclick="toggleMusic()">
        <svg id="musicIcon" class="music-icon playing" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="note" d="M9 18V5L21 3V16M9 18C9 19.6569 7.65685 21 6 21C4.34315 21 3 19.6569 3 18C3 16.3431 4.34315 15 6 15C7.65685 15 9 16.3431 9 18ZM21 16C21 17.6569 19.6569 19 18 19C16.3431 19 15 17.6569 15 16C15 14.3431 16.3431 13 18 13C19.6569 13 21 14.3431 21 16Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <line class="wave wave-1" x1="23" y1="8" x2="23" y2="12" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <line class="wave wave-2" x1="26" y1="6" x2="26" y2="14" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <line class="wave wave-3" x1="29" y1="4" x2="29" y2="16" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
    </button>

    <script src="main.js"></script>
