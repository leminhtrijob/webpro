<!DOCTYPE html>
<html lang="vi">
  <head>
  <base href="/templates/dlove-7/">
  <script src="/vendor/trikun-bridge.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DearGift</title>
    <meta name="theme-color" content="#FFF0F5" />

    <!-- Tự cứu màn hình trắng do cache cũ — giống index.html. Route động cũng nạp
         cùng bundle, nên máy cũ vào /:slug cũng có thể dính bundle hash đã bị xoá. -->
    <script>
      window.__DG_BOOTED__ = true;
    </script>

    <!-- Shell tối giản cho ROUTE ĐỘNG (/:slug, /dashboard, /admin, /galaxy...).
         vercel.json rewrite mọi đường dẫn không có file tĩnh về đây.
         KHÔNG dùng index.html làm fallback: index.html đã được prerender kèm nguyên
         nội dung trang chủ, nên vào /tenban sẽ chớp trang chủ rồi mới nhảy sang quà.
         KHÔNG đặt canonical/description ở đây — component SEO tự set theo route,
         và route động thì không nên tự nhận canonical nào cả. -->
    <meta name="robots" content="noindex, follow" />

    <!-- Icons -->
    <link rel="icon" href="/templates/dlove-7/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/templates/dlove-7/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/templates/dlove-7/apple-touch-icon.png" />

    <!-- Shell loading UI (CSS thuần, hiện trước khi React mount) -->
    <style>
      html, body { margin: 0; height: 100%; background: #FFFFFF; }
      #root { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      .dg-shell-spinner {
        width: 40px; height: 40px; border-radius: 50%;
        border: 3px solid #FFE0EC;
        border-top-color: #F92F72;
        animation: dg-spin 0.8s linear infinite;
      }
      @keyframes dg-spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" crossorigin src="/templates/dlove-7/assets/js/react-vendor-CGbKR0Ci.js"></script>
    <script type="module" crossorigin src="/templates/dlove-7/assets/js/main-BjOxye8B.js"></script>
    <link rel="stylesheet" crossorigin href="/templates/dlove-7/assets/css/main-CntYjU1P.css">
  </head>
  <body>
    <div id="root">
      <div class="dg-shell-spinner" role="status" aria-label="Đang tải"></div>
    </div>
</body>
</html>
