        .envelope {
            position: relative;
            width: 300px;
            height: 200px;
            background-color: #f08080;
        }

        .envelope:before {
            background-color: #f08080;
            content: "";
            position: absolute;
            width: 212px;
            height: 212px;
            transform: rotate(45deg);
            top: -105px;
            left: 44px;

            content: "";

        .heart {

            display: inline-block;

            margin: 0 10px;
            position: relative;
            top: 110px;
            left: 105px;
            transform: rotate(-45deg);
            width: 30px;
        }

        .heart:before,
        .heart:after {
            content: "";
            background-color: #d62828;
            border-radius: 50%;
            height: 30px;
            position: absolute;
            width: 30px;
        }

        .heart:before {
            top: -15px;
            left: 0;
        }

        .heart:after {
            left: 15px;
            top: 0;
        }

        .hearts {
            position: absolute;
            top: 0
        }

        .one,
        .two,
        .three,
        .four,
        .five {
            background-color: red;
            display: inline-block;
            height: 10px;
            margin: 0 10px;
            position: relative;
            transform: rotate(-45deg);
            width: 10px;
            top: 50px;
        }

        .one:before,
        .one:after,
        .two:before,
        .two:after,
        .three:before,
        .three:after,
        .four:before,
        .four:after,
        .five:before,
        .five:after {
            content: "";
            background-color: red;
            border-radius: 50%;
            height: 10px;
            position: absolute;
            width: 10px;
        }

        .one:before,
        .two:before,
        .three:before,
        .four:before,
        .five:before {
            top: -5px;
            left: 0;
        }

        .one:after,
        .two:after,
        .three:after,
        .four:after,
        .five:after {
            left: 5px;
            top: 0;
        }

        .one {
            left: 10px;
            animation: heart 1s ease-out infinite;
        }

        .two {
            left: 30px;
            animation: heart 2s ease-out infinite;
        }

        .three {
            left: 50px;
            animation: heart 1.5s ease-out infinite;
        }

        .four {
            left: 70px;
            animation: heart 2.3s ease-out infinite;
        }

        .five {
            left: 90px;
            animation: heart 1.7s ease-out infinite;
        }

        @keyframes heart {
            0% {
                transform: translateY(0) rotate(-45deg) scale(0.3);
                opacity: 1;
            }

            100% {
                transform: translateY(-150px) rotate(-45deg) scale(1.3);
                opacity: 0.5;
            }
        }

        .front {
            position: absolute;
            border-right: 180px solid #f4978e;
            border-top: 95px solid transparent;
            border-bottom: 100px solid transparent;
            left: 120px;
            top: 5px;
            width: 0;
            height: 0;
            z-index: 10;
        }

        .front:before {
            position: absolute;
            content: "";
            border-left: 300px solid #f8ad9d;
            border-top: 195px solid transparent;
            left: -120px;
            top: -95px;
            width: 0;
            height: 0;
        }

        .shadow {
            position: absolute;
            width: 330px;
            height: 25px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.3);
            top: 265px;

            z-index: -1;
        }

        @keyframes scale {

            0%,
            100% {
                transform: scaleX(1);
            }

            50% {
                transform: scaleX(0.85);
            }
        }

        .hover-animation {
            animation: hover 1.75s ease-in-out infinite;
        }

        #castle {
            display: flex;

            }

            }

        @keyframes glow {
            0% {

            }

        @keyframes fall {

                opacity: 0.5;
            }

            100% {
                background-size: 105% 120%;
                background-position: 0 0;
                opacity: 0.7;
            }
        }

    <!-- Responsive -->
    <style>
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
        }

        #castle {
            height: 100dvh;
            overflow: hidden;
        }

        .container {
            height: 97dvh;
        }

        .wrapperLetterForm {
            position: fixed;
            height: 100dvh;
        }

        /* Thư: cho phép cuộn nội dung bên trong khi chữ dài */
        .letter__border .letter {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .text__letter p {
            position: static;
            white-space: pre-line;
            word-break: break-word;
        }

        /* Tablet */
        @media screen and (max-width: 1024px) {
            .box__letter .letter__border {
                width: 80vw;
            }
        }

        /* Mobile */
        @media screen and (max-width: 768px) {
            .container svg {
                width: 80%;
                height: auto;
            }

            /* Phong bì nhỏ lại để trái tim chữ bao quanh được */
            #castle .letter {
                transform: scale(0.6);
            }

            .box__letter .letter__border {
                width: 94vw;
                height: 85vh;
                height: 85dvh;
                padding: 10px;
                border-radius: 20px;
            }

            .letter__border .letter {
                padding: 12px 0 20px;
            }

            .letter__border .letter .title__letter {
                font-size: clamp(1.4rem, 6.5vw, 2rem);
                padding: 0 12px;
            }

            .letter__border .letter .content__letter {
                flex-direction: column;
                height: auto;
                padding: 1rem 0 0;
            }

            .letter__border .letter .content__letter .left,
            .content__letter .right {
                width: 100%;
            }

            .letter__border .letter .content__letter .left {
                height: auto;
                padding: 0 1.2rem 1rem;
                border-right: none;
                border-bottom: 3px solid var(--color-border);
            }

            .content__letter .left #heart__letter {
                width: auto;
                max-width: 80%;
                max-height: 38vh;
                max-height: 38dvh;
                transform: rotate(-4deg);
            }

            .content__letter .right .text__letter {
                padding: 16px 16px 90px;
                font-size: 1.1rem !important;
                line-height: 1.5;
            }

            .content__letter .right #mewmew {
                width: 64px;
            }

            .letter__border .close {
                width: 36px;
                height: 36px;
                right: -6px;
                top: -6px;
                z-index: 5;
            }
        }

        /* Điện thoại nhỏ */
        @media screen and (max-width: 380px) {
            #castle .letter {
                transform: scale(0.55);
            }

            .content__letter .right .text__letter {
                font-size: 1rem !important;
            }
        }

        /* Điện thoại xoay ngang / màn hình thấp */
        @media screen and (max-height: 500px) and (orientation: landscape) {
            .container svg {
                width: auto;
                height: 70%;
            }

            #text-click {
                top: 82% !important;
                font-size: 22px !important;
            }

            #castle .letter {
                transform: scale(0.6);
            }

            .box__letter .letter__border {
                width: 90vw;
                height: 90dvh;
            }

            .letter__border .letter .content__letter {
                flex-direction: row;
            }

            .letter__border .letter .content__letter .left {
                width: 40%;
                border-bottom: none;
                border-right: 3px solid var(--color-border);
            }

            .content__letter .right {
                width: 60%;
            }

            .content__letter .left #heart__letter {
                max-height: 60dvh;
            }

            .letter__border .letter .title__letter {
                font-size: 1.6rem;
            }

            .content__letter .right .text__letter {
                margin-top: 0 !important;
                padding: 8px 16px 70px;
                font-size: 1rem !important;
            }
        }
    </style>
    <!-- Bàn ảnh Polaroid -->
    <style>
        .btn-photos {
            display: none;
            margin: 18px auto 0;
            padding: 10px 22px;
            border: 2px solid #333;
            border-radius: 999px;
            background: #ff7882;
            color: #fff;
            font-family: "Sriracha", cursive;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #333;
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .btn-photos.show {
            display: block;
            animation: btnPop .6s ease-out both, btnPulse 2s 1s ease-in-out infinite;
        }

        .btn-photos:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #333;
        }

        @keyframes btnPop {
            0% { opacity: 0; transform: scale(.5); }
            70% { opacity: 1; transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        @keyframes btnPulse {
            0%, 100% { box-shadow: 0 4px 0 #333, 0 0 0 0 rgba(255, 120, 130, .6); }
            50% { box-shadow: 0 4px 0 #333, 0 0 0 10px rgba(255, 120, 130, 0); }
        }

        .photo-table {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: none;
            flex-direction: column;
            background-color: #fae1dd;
            background-image:
                radial-gradient(rgba(255, 255, 255, .55) 1.5px, transparent 1.5px),
                radial-gradient(circle at 50% 40%, #fff4f1 0%, #fae1dd 55%, #f6cfc8 100%);
            background-size: 22px 22px, 100% 100%;
            overflow: hidden;
            touch-action: none;
        }

        .photo-table.show {
            display: flex;
            animation: ptFade .5s ease-out both;
        }

        @keyframes ptFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .pt-header {
            flex: 0 0 auto;
            padding: max(14px, env(safe-area-inset-top)) 16px 4px;
            text-align: center;
            pointer-events: none;
        }

        .pt-title {
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
            font-size: clamp(1.5rem, 5vw, 2.6rem);
            color: #c94f62;
            line-height: 1.2;
        }

        .pt-hint {
            margin-top: 2px;
            font-family: "Sriracha", cursive;
            font-size: clamp(.75rem, 2.6vw, .95rem);
            color: #9a6b6b;
        }

        .pt-board {
            position: relative;
            flex: 1 1 auto;
            margin: 6px 12px;
            z-index: 1;
            isolation: isolate;
            --card-w: 160px;
        }

        .pt-polaroid {
            position: absolute;
            width: var(--card-w);
            padding: calc(var(--card-w) * .06) calc(var(--card-w) * .06) 0;
            background: #fffdf8;
            border-radius: 3px;
            box-shadow: 0 6px 16px rgba(80, 30, 30, .25), 0 1px 3px rgba(0, 0, 0, .15);
            translate: -50% -50%;
            rotate: var(--r, 0deg);
            cursor: grab;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            transition: scale .2s ease, box-shadow .2s ease;
        }

        .pt-polaroid.drop {
            animation: ptDrop .9s cubic-bezier(.2, .9, .3, 1.15) both;
        }

        @keyframes ptDrop {
            0% {
                opacity: 0;
                translate: -50% -120vh;
                rotate: calc(var(--r, 0deg) + 35deg);
                scale: 1.4;
            }
            100% {
                opacity: 1;
                translate: -50% -50%;
                rotate: var(--r, 0deg);
                scale: 1;
            }
        }

        .pt-polaroid.dragging {
            cursor: grabbing;
            scale: 1.08;
            box-shadow: 0 18px 34px rgba(80, 30, 30, .35);
        }

        .pt-polaroid img {
            display: block;
            width: 100%;
            aspect-ratio: 3 / 4;
            object-fit: cover;
            background: #f1e6e3;
            pointer-events: none;
        }

        .pt-caption {
            display: block;
            padding: calc(var(--card-w) * .05) 2px calc(var(--card-w) * .07);
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
            font-size: calc(var(--card-w) * .095);
            text-align: center;
            color: #5a3a3a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pt-actions {
            flex: 0 0 auto;
            display: flex;
            justify-content: center;

<script>
/**
 * Mã hóa object thành compressed Base64URL string
 * @param {Object} data - Dữ liệu cần mã hóa
 * @returns {string} - Chuỗi Base64URL đã nén
 */
function encodeData(data) {
  try {
    const jsonString = JSON.stringify(data);
    const compressed = pako.deflate(jsonString);
    let binaryString = '';
    for (let i = 0; i < compressed.length; i++) {
      binaryString += String.fromCharCode(compressed[i]);
    }
    const base64 = btoa(binaryString);
    const base64url = base64
      .replace(/\+/g, '-')
      .replace(/\//g, '_')
      .replace(/=/g, '');
    return base64url;
  } catch (e) {
    console.error("Lỗi khi mã hóa dữ liệu:", e);
    return null;
  }
}

/**
 * Giải mã Base64URL string thành object
 * @param {string} encodedString - Chuỗi Base64URL đã nén
 * @returns {Object|null} - Object đã giải nén hoặc null nếu lỗi
 */
function decodeData(encodedString) {
  try {
    let base64 = encodedString
      .replace(/-/g, '+')
      .replace(/_/g, '/');
    while (base64.length % 4) {
      base64 += '=';
    }
    const binaryString = atob(base64);
    const bytes = new Uint8Array(binaryString.length);
    for (let i = 0; i < binaryString.length; i++) {
      bytes[i] = binaryString.charCodeAt(i);
    }
    const decompressed = pako.inflate(bytes, { to: 'string' });
    const data = JSON.parse(decompressed);
    return data;
  } catch (e) {
    console.error("Lỗi khi giải mã dữ liệu:", e);
    return null;
  }
}

/**
 * Lấy tham số từ URL
 */
function getUrlParameter(name) {
  const urlParams = new URLSearchParams(window.location.search);
  const compressedContent = urlParams.get("c");
  if (compressedContent) {
    const content = decodeData(compressedContent);
    if (content) {
      if (name === "title" && content.title) return content.title;
      if (name === "subtitle" && content.subtitle) return content.subtitle;
      if (name === "instructionText" && content.instructionText) return content.instructionText;
      if (name === "cardText" && content.cardText) return content.cardText;
      if (name === "modalTitle" && content.modalTitle) return content.modalTitle;
      if (name === "modalContent" && content.modalContent) return content.modalContent;
      if (name === "image" && content.image) return content.image;
      if (name === "music" && content.music) return content.music;
      if (name === "dateText" && content.dateText) return content.dateText;
    }
  }
  const regularParam = urlParams.get(name);
  if (regularParam) {
    return decodeURIComponent(regularParam);
  }
  return null;
}

// Giá trị mặc định
const DEFAULT_CONFIG = {
  title: "💐Chúc Mừng Ngày 20/10",
  subtitle: "💕Yêu Thương Gửi Em!💕",
  instructionText: "Chạm hoa hồng để mở bất ngờ!",
  cardText: "Happy Vietnamese Women's Day!",
  modalTitle: "Nhân ngày Phụ nữ Việt Nam 20/10",
  modalContent: "Nhân ngày Phụ nữ Việt Nam 20/10, anh muốn gửi đến em lời chúc tốt đẹp nhất. Chúc em luôn xinh đẹp, rạng rỡ, mạnh khỏe và hạnh phúc. Cảm ơn em đã luôn dịu dàng, mạnh mẽ và là một nửa tuyệt vời của anh. Em xứng đáng được yêu thương không chỉ hôm nay mà mỗi ngày! 🌹💖",
  dateText: "20 - 10 - 2026",
  image: "./photos/p08.jpg",
  // Không có nhạc mặc định: chỉ phát nhạc người dùng tải lên
  music: ""
};

// Tham số trên URL (?c=... hoặc ?title=...) luôn được ưu tiên cao nhất
const CONFIG_KEYS = ["title", "subtitle", "instructionText", "cardText", "modalTitle", "modalContent", "dateText", "image", "music"];
const CONFIG = {};
CONFIG_KEYS.forEach(function(key) {
  CONFIG[key] = getUrlParameter(key) || DEFAULT_CONFIG[key];
});
CONFIG.photos = null; // null = dùng album ảnh mặc định

/**
 * Nạp setting từ lovegift.online khi URL có ?id=...
 * Thứ tự ưu tiên: tham số URL > setting API > DEFAULT_CONFIG
 */
const LOVEGIFT_API = "https://lovegift.online/api/settings/";

function applyApiSettings(s) {
  CONFIG_KEYS.forEach(function(key) {
    if (key === "image" || getUrlParameter(key)) return;
    if (typeof s[key] === "string" && s[key].trim()) CONFIG[key] = s[key];
  });
  const images = (Array.isArray(s.image) ? s.image : [s.image])
    .filter(function(src) { return typeof src === "string" && src.trim(); });
  if (images.length) {
    if (!getUrlParameter("image")) CONFIG.image = images[0];
    CONFIG.photos = images;
  }
}

const CONFIG_READY = (function() {
  const id = new URLSearchParams(window.location.search).get("id");
  if (!id) return Promise.resolve(CONFIG);
  return fetch(LOVEGIFT_API + encodeURIComponent(id))
    .then(function(r) { return r.json(); })
    .then(function(json) {
      const settings = json && json.success && json.data && json.data.settings;
      if (settings) applyApiSettings(settings);
      else console.warn("[lovegift] Không có setting cho id, dùng mặc định:", id);
      return CONFIG;
    })
    .catch(function(err) {
      console.warn("[lovegift] Lỗi gọi API, dùng mặc định:", err);
      return CONFIG;
    });
})();

    function applyConfigToDOM() {
        const cardText = document.getElementById('card-text');
        if (cardText) {
            cardText.textContent = CONFIG.cardText.replace(/<br\s*\/?>/gi, ' ');
        }

        const textClick = document.getElementById('text-click');
        if (textClick) {
            textClick.textContent = CONFIG.instructionText;
        }

        const heartLetterImg = document.getElementById('heart__letter');
        if (heartLetterImg) {
            heartLetterImg.src = CONFIG.image;
        }

        // Cập nhật audio source
        const audio = document.getElementById('background-music');
        if (CONFIG.music) {
            audio.src = CONFIG.music;
            audio.play().catch(error => {
                console.log('Trình duyệt đã chặn tự động phát nhạc.');
            });
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        CONFIG_READY.then(applyConfigToDOM);

        const audio = document.getElementById('background-music');
        document.body.addEventListener('click', function() {
            if (audio.paused && CONFIG.music) {
                audio.play();
            }
        });
    });
</script>

    <script>
        let PHOTOS = [
            { src: "./photos/p01.jpg", caption: "Cười cùng nhau 😆" },
            { src: "./photos/p02.jpg", caption: "Ngày của em 🌸" },
            { src: "./photos/p03.jpg", caption: "Thương em nhiều 💖" },
            { src: "./photos/p04.jpg", caption: "Mãi bên nhau nhé" },
            { src: "./photos/p05.jpg", caption: "Em xinh nhất 🌷" },
            { src: "./photos/p06.jpg", caption: "Kỷ niệm của mình" },
            { src: "./photos/p07.jpg", caption: "Hạnh phúc là đây ✨" },
            { src: "./photos/p08.jpg", caption: "Hoa tặng em 💐" },
            { src: "./photos/p09.jpg", caption: "Cứ thế thôi 💕" },
            { src: "./photos/p10.jpg", caption: "Chỉ cần có em" },
            { src: "./photos/p11.jpg", caption: "Đi đâu cũng được" },
            { src: "./photos/p12.jpg", caption: "20 · 10 · 2026 💝" }
        ];

        // Ảnh từ lovegift thay album mặc định, mượn chú thích mặc định theo thứ tự
        CONFIG_READY.then(() => {
            if (!CONFIG.photos) return;
            PHOTOS = CONFIG.photos.map((src, i) => ({ src, caption: PHOTOS[i] ? PHOTOS[i].caption : "" }));
        });

        let photosPreloaded = false;
        function preloadPhotos() {
            if (photosPreloaded) return;
            photosPreloaded = true;
            PHOTOS.forEach(p => { const img = new Image(); img.src = p.src; });
        }

        function showPhotoButton() {
            preloadPhotos();
            document.getElementById('btn-photos').classList.add('show');
        }

        function hidePhotoButton() {
            document.getElementById('btn-photos').classList.remove('show');
        }

        (() => {
            const table = document.getElementById('photo-table');
            const board = document.getElementById('pt-board');
            const lightbox = document.getElementById('pt-lightbox');
            const lbImg = document.getElementById('pt-lb-img');
            const lbCaption = document.getElementById('pt-lb-caption');
            let zTop = 10;
            let lbIndex = 0;
            const rand = (min, max) => Math.random() * (max - min) + min;

            function buildCards() {
                board.innerHTML = '';
                PHOTOS.forEach((p, i) => {
                    const el = document.createElement('div');
                    el.className = 'pt-polaroid';
                    el.dataset.index = i;
                    el.innerHTML = '<img src="' + p.src + '" alt="" draggable="false">' +
                        '<span class="pt-caption"></span>';
                    el.querySelector('.pt-caption').textContent = p.caption;
                    enableDrag(el);
                    board.appendChild(el);
                });
            }

            // Rải ảnh theo lưới có lệch ngẫu nhiên để ảnh chồng nhẹ lên nhau nhưng không đè kín
            function scatter(animate) {
                const cards = Array.from(board.children);
                const W = board.clientWidth;
                const H = board.clientHeight;
                const n = cards.length;
                const cols = Math.max(2, Math.ceil(Math.sqrt(n * W / H)));
                const rows = Math.ceil(n / cols);
                const cellW = W / cols;
                const cellH = H / rows;
                // Chiều cao Polaroid ≈ 1.63 lần chiều rộng (ảnh 3:4 + viền + chú thích)
                const cardW = Math.round(Math.max(76, Math.min(cellW * 0.92, cellH * 0.66, 230)));
                board.style.setProperty('--card-w', cardW + 'px');

                const order = cards.map((_, i) => i).sort(() => Math.random() - 0.5);
                cards.forEach((el, k) => {
                    const slot = order[k];
                    const col = slot % cols;
                    const row = Math.floor(slot / cols);
                    const x = (col + 0.5) * cellW + rand(-0.18, 0.18) * cellW;
                    const y = (row + 0.5) * cellH + rand(-0.12, 0.12) * cellH;
                    placeCard(el, x, y);
                    el.style.setProperty('--r', rand(-14, 14).toFixed(1) + 'deg');
                    el.style.zIndex = ++zTop;
                    if (animate) {
                        el.classList.remove('drop');
                        void el.offsetWidth;
                        el.style.animationDelay = (k * 0.18).toFixed(2) + 's';
                        el.classList.add('drop');
                    }
                });
            }

            // Giữ tâm ảnh trong khung bàn
            function placeCard(el, x, y) {
                const halfW = el.offsetWidth / 2 || 60;
                const halfH = el.offsetHeight / 2 || 80;
                const W = board.clientWidth;
                const H = board.clientHeight;
                el.style.left = (W > halfW * 2 ? Math.min(Math.max(x, halfW), W - halfW) : W / 2) + 'px';
                el.style.top = (H > halfH * 2 ? Math.min(Math.max(y, halfH), H - halfH) : H / 2) + 'px';
            }

            function enableDrag(el) {
                let startX, startY, originX, originY, moved, pointerId = null;

                el.addEventListener('pointerdown', (e) => {
                    if (pointerId !== null) return;
                    pointerId = e.pointerId;
                    el.setPointerCapture(pointerId);
                    startX = e.clientX;
                    startY = e.clientY;
                    originX = parseFloat(el.style.left);
                    originY = parseFloat(el.style.top);
                    moved = false;
                    el.style.zIndex = ++zTop;
                    el.classList.add('dragging');
                });

                el.addEventListener('pointermove', (e) => {
                    if (e.pointerId !== pointerId) return;
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    if (!moved && Math.hypot(dx, dy) < 6) return;
                    moved = true;
                    placeCard(el, originX + dx, originY + dy);
                });

                const end = (e) => {
                    if (e.pointerId !== pointerId) return;
                    pointerId = null;
                    el.classList.remove('dragging');
                    if (!moved && e.type === 'pointerup') openLightbox(+el.dataset.index);
                };
                el.addEventListener('pointerup', end);
                el.addEventListener('pointercancel', end);
            }

            function openTable() {
                hidePhotoButton();
                $(".letter__border .fa-xmark").trigger("click");
                table.classList.add('show');
                table.setAttribute('aria-hidden', 'false');
                if (!board.children.length) buildCards();
                requestAnimationFrame(() => scatter(true));
            }

            function closeTable() {
                table.classList.remove('show');
                table.setAttribute('aria-hidden', 'true');
            }

            function showLightboxPhoto(i) {
                lbIndex = (i + PHOTOS.length) % PHOTOS.length;
                lbImg.src = PHOTOS[lbIndex].src;
                lbCaption.textContent = PHOTOS[lbIndex].caption;
            }

            function openLightbox(i) {
                showLightboxPhoto(i);
                lightbox.classList.add('show');
                lightbox.setAttribute('aria-hidden', 'false');
            }

            function closeLightbox() {
                lightbox.classList.remove('show');
                lightbox.setAttribute('aria-hidden', 'true');
            }

            document.getElementById('btn-photos').addEventListener('click', (e) => {
                e.stopPropagation();
                openTable();
            });
            document.getElementById('pt-shuffle').addEventListener('click', () => scatter(true));
            document.getElementById('pt-reread').addEventListener('click', () => {
                closeTable();
                window.openLetter();
            });

            lightbox.querySelector('.pt-lb-close').addEventListener('click', closeLightbox);
            lightbox.querySelector('.pt-lb-prev').addEventListener('click', (e) => { e.stopPropagation(); showLightboxPhoto(lbIndex - 1); });
            lightbox.querySelector('.pt-lb-next').addEventListener('click', (e) => { e.stopPropagation(); showLightboxPhoto(lbIndex + 1); });
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) closeLightbox();
            });

            // Vuốt trái/phải để chuyển ảnh trên điện thoại
            let swipeX = null;
            lightbox.addEventListener('touchstart', (e) => { swipeX = e.touches[0].clientX; }, { passive: true });
            lightbox.addEventListener('touchend', (e) => {
                if (swipeX === null) return;
                const dx = e.changedTouches[0].clientX - swipeX;
                swipeX = null;
                if (Math.abs(dx) > 50) showLightboxPhoto(lbIndex + (dx < 0 ? 1 : -1));
            });

            document.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('show')) return;
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft') showLightboxPhoto(lbIndex - 1);
                if (e.key === 'ArrowRight') showLightboxPhoto(lbIndex + 1);
            });

            // Xoay màn hình / đổi kích thước: rải lại cho vừa khung mới
            let resizeTimer;
            window.addEventListener('resize', () => {
                if (!table.classList.contains('show')) return;
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => scatter(false), 200);
            });
        })();
    </script>
</body>
