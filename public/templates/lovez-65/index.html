function switchTab(lang) {
  activeTab = lang;
  document
    .querySelectorAll(".tab")
    .forEach((t) => t.classList.toggle("active", t.dataset.lang === lang));
  document
    .querySelectorAll(".editor-pane")
    .forEach((p) => p.classList.toggle("active", p.id === `pane-${lang}`));
  setTimeout(() => editors[lang].refresh(), 10);
  updateStats();

  document.getElementById("cursorInfo").textContent =
    `Ln ${cur.line + 1}, Col ${cur.ch + 1}`;

// ── RUN CODE ───────────────────────────────
function runCode() {
  const html = htmlEditor.getValue();
  const css = cssEditor.getValue();
  const js = jsEditor.getValue();

  // Console interceptor injected into iframe
  const consoleInterceptor = `<script>
(function () {
  var methods = ['log', 'warn', 'error', 'info'];
  methods.forEach(function (m) {
    var orig = console[m];
    console[m] = function () {
      var args = Array.prototype.slice.call(arguments);
      var msg = args.map(function (a) {
        try { return typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a); }
        catch (e) { return String(a); }
      }).join(' ');
      window.parent.postMessage({ type: 'console', level: m, msg: msg }, '*');
      orig.apply(console, arguments);
    };
  });
  window.addEventListener('error', function (e) {
    window.parent.postMessage({
      type: 'console', level: 'error',
      msg: '🔴 ' + e.message + ' (line ' + e.lineno + ')'
    }, '*');
  });
  window.addEventListener('unhandledrejection', function (e) {
    window.parent.postMessage({
      type: 'console', level: 'error',
      msg: '🔴 Unhandled Promise: ' + e.reason
    }, '*');
  });
})();
<\/script>`;

  const isFullDoc = /^\s*<!doctype/i.test(html) || /^\s*<html/i.test(html);
  let content;

  if (isFullDoc) {
    // Insert CSS before </head> and JS + interceptor before </body>
    content = html
      .replace("</head>", `<style>${css}</style></head>`)
      .replace(
        "</body>",
        `${consoleInterceptor}<script>${js}<\/script></body>`,
      );
    if (!content.includes("</head>"))
      content = html.replace(
        "</body>",
        `<style>${css}</style>${consoleInterceptor}<script>${js}<\/script></body>`,
      );
  } else {
    content = `<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <style>${css}</style>
</head>
<body>
${html}
${consoleInterceptor}
<script>${js}<\/script>
</body>
</html>`;
  }

  document.getElementById("preview").srcdoc = content;
}

// ── LISTEN TO IFRAME CONSOLE ───────────────
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "console") {
    addConsoleLog(e.data.level, e.data.msg);
  }
});

function addConsoleLog(level, msg) {
  const logs = document.getElementById("consoleLogs");

  // Remove empty placeholder
  const empty = logs.querySelector(".console-empty");
  if (empty) empty.remove();

  const line = document.createElement("div");
  line.className = `console-log-line ${level}`;
  const icons = { log: "▶", warn: "⚠", error: "✕", info: "ℹ" };
  line.innerHTML = `<span class="prefix">${icons[level] || "▶"}</span><span>${escapeHtml(msg)}</span>`;
  logs.appendChild(line);
  logs.scrollTop = logs.scrollHeight;

  if (level === "error") {
    errorCount++;
    const badge = document.getElementById("consoleBadge");
    badge.textContent = errorCount;
    badge.classList.add("visible");
    // Auto-expand console on error
    if (isCollapsed) toggleConsole();
  }
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

}

// ── OPEN FOLDER ────────────────────────────
async function openFolder() {
  if (!("showDirectoryPicker" in window)) {
    // Fallback: mở file input
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".html,.css,.js";
    input.multiple = true;
    input.onchange = async (e) => {
      const files = Array.from(e.target.files);
      for (const f of files) {
        const text = await f.text();
        if (f.name.endsWith(".html")) htmlEditor.setValue(text);
        else if (f.name.endsWith(".css")) cssEditor.setValue(text);
        else if (f.name.endsWith(".js") && !f.name.endsWith(".min.js"))
          jsEditor.setValue(text);
      }
      showToast(`📂 Đã tải ${files.length} file!`);
      runCode();
    };
    input.click();
    return;
  }
  try {
    const dir = await window.showDirectoryPicker({ mode: "read" });
    const tryLoad = async (name, editor) => {
      try {
        const fh = await dir.getFileHandle(name);
        const f = await fh.getFile();
        editor.setValue(await f.text());
        return true;
      } catch {
        return false;
      }
    };
    const results = await Promise.all([
      tryLoad("index.html", htmlEditor),
      tryLoad("style.css", cssEditor),
      tryLoad("styles.css", cssEditor),
      tryLoad("script.js", jsEditor),
    ]);
    const loaded = results.filter(Boolean).length;
    if (loaded === 0) {
      showToast("⚠ Không tìm thấy file nào");
      return;
    }
    showToast(`📂 Đã tải ${loaded} file!`);
    runCode();
  } catch (e) {
    if (e.name !== "AbortError") showToast("⚠ Không thể mở thư mục");
  }
}

function saveToLocal() {
  try {

      STORAGE_KEY,
      JSON.stringify({
        html: htmlEditor.getValue(),
        css: cssEditor.getValue(),
        js: jsEditor.getValue(),
      }),
    );
    const el = document.getElementById("autoSaveStatus");
    if (el)
      el.textContent =
        "💾 Đã lưu " +
        new Date().toLocaleTimeString("vi-VN", {
          hour: "2-digit",
          minute: "2-digit",
        });
  } catch (e) {
    /* localStorage full */
  }
}

function loadFromLocal() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!data) return false;
    // Chỉ ghi đè nếu có nội dung thực sự trong localStorage
    if (data.html !== undefined) htmlEditor.setValue(data.html);
    if (data.css !== undefined) cssEditor.setValue(data.css);
    if (data.js !== undefined) jsEditor.setValue(data.js);
    return true;
  } catch {
    return false;
  }
}

// ── FIND & REPLACE ─────────────────────────
let findCursor = null;

function openFindModal() {
  document.getElementById("findModal").classList.add("open");
  setTimeout(() => document.getElementById("findInput").focus(), 50);
  // Count on open
  const fi = document.getElementById("findInput");
  fi.addEventListener("input", onFindInput);
}
function closeFindModal() {
  document.getElementById("findModal").classList.remove("open");
  findCursor = null;
  document.getElementById("matchCount").textContent = "";
  document
    .getElementById("findInput")
    .removeEventListener("input", onFindInput);
}
function handleFindModalClick(e) {
  if (e.target === document.getElementById("findModal")) closeFindModal();
}
function onFindInput() {
  const query = document.getElementById("findInput").value;
  const cs = document.getElementById("caseSensitive").checked;
  const n = countMatches(query, cs);
  document.getElementById("matchCount").textContent = query
    ? `${n} kết quả`
    : "";
}
function countMatches(query, caseSensitive) {
  if (!query) return 0;
  const content = editors[activeTab].getValue();
  const flags = caseSensitive ? "g" : "gi";
  try {
    return (
      content.match(
        new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), flags),
      ) || []
    ).length;
  } catch {
    return 0;
  }
}
function findNext() {
  const query = document.getElementById("findInput").value;
  const cs = document.getElementById("caseSensitive").checked;
  if (!query) return;
  const ed = editors[activeTab];
  const cur = ed.getSearchCursor(query, findCursor ? findCursor.to() : null, {
    caseFold: !cs,
  });
  if (cur.findNext()) {
    findCursor = cur;
    ed.setSelection(cur.from(), cur.to());
    ed.scrollIntoView({ from: cur.from(), to: cur.to() }, 80);
  } else {
    findCursor = null;
    const c2 = ed.getSearchCursor(query, null, { caseFold: !cs });
    if (c2.findNext()) {
      findCursor = c2;
      ed.setSelection(c2.from(), c2.to());
      ed.scrollIntoView({ from: c2.from(), to: c2.to() }, 80);
      showToast("🔄 Bắt đầu lại từ đầu");
    } else {
      showToast("⚠ Không tìm thấy: " + query);
    }
  }
}
function replaceOne() {
  const query = document.getElementById("findInput").value;
  const rep = document.getElementById("replaceInput").value;
  if (!query) return;
  if (findCursor) {
    findCursor.replace(rep);
    showToast("✅ Đã thay 1 kết quả");
    findNext();
  } else findNext();
}
function replaceAll() {
  const query = document.getElementById("findInput").value;
  const rep = document.getElementById("replaceInput").value;
  const cs = document.getElementById("caseSensitive").checked;
  if (!query) return;
  const ed = editors[activeTab];
  const cur = ed.getSearchCursor(query, null, { caseFold: !cs });
  let count = 0;
  while (cur.findNext()) {
    cur.replace(rep);
    count++;
  }
  findCursor = null;
  document.getElementById("matchCount").textContent = "";
  showToast(count > 0 ? `✅ Đã thay ${count} kết quả` : "⚠ Không tìm thấy gì");
}

function downloadZip() {

  inp.value = "my-project";
  updateZipPreview();
  inp.addEventListener("input", updateZipPreview);
  document.getElementById("downloadModal").classList.add("open");
}
function updateZipPreview() {
  const name =
    document.getElementById("projectNameInput").value.trim() || "my-project";
  document.getElementById("zipPreviewName").textContent = name + ".zip";
}
function closeDownloadModal() {
  document.getElementById("downloadModal").classList.remove("open");
}
function handleDownloadModalClick(e) {
  if (e.target === document.getElementById("downloadModal"))
    closeDownloadModal();
}
async function confirmDownload() {
  const name =
    document.getElementById("projectNameInput").value.trim() || "my-project";
  closeDownloadModal();
  try {
    const zip = new JSZip();
    const folder = zip.folder(name);
    folder.file("index.html", htmlEditor.getValue());
    folder.file("style.css", cssEditor.getValue());
    folder.file("script.js", jsEditor.getValue());
    const blob = await zip.generateAsync({
      type: "blob",
      compression: "DEFLATE",
    });
    const url = URL.createObjectURL(blob);
    const a = Object.assign(document.createElement("a"), {
      href: url,
      download: name + ".zip",
    });
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast(`📦 Đã tải ${name}.zip!`);
  } catch (e) {
    showToast("⚠ Lỗi ZIP: " + e.message);
  }
}

// Build template grid
(function buildTemplates() {
  const grid = document.getElementById("templateGrid");
  TEMPLATES.forEach((t) => {
    const card = document.createElement("div");
    card.className = "template-card";
    card.innerHTML = `<h4>${t.icon} ${t.name}</h4><p>${t.desc}</p>`;
    card.addEventListener("click", () => loadTemplate(t.id));
    grid.appendChild(card);
  });
})();

function openTemplateModal() {
  document.getElementById("templateModal").classList.add("open");
}
function closeTemplateModal() {
  document.getElementById("templateModal").classList.remove("open");
}
function handleModalClick(e) {
  if (e.target === document.getElementById("templateModal"))
    closeTemplateModal();
}

function loadTemplate(id) {
  const t = TEMPLATES.find((t) => t.id === id);
  if (!t) return;
  htmlEditor.setValue(t.html);
  cssEditor.setValue(t.css);
  jsEditor.setValue(t.js);
  closeTemplateModal();
  runCode();
  showToast(`✅ Đã tải template "${t.name}"!`);
}

// ── RESIZER ────────────────────────────────
(function initResizer() {
  const resizer = document.getElementById("resizer");
  const editorPanel = document.getElementById("editorPanel");
  const workspace = document.querySelector(".workspace");
  let dragging = false;

  resizer.addEventListener("mousedown", (e) => {
    dragging = true;
    resizer.classList.add("dragging");
    document.body.style.cursor = "col-resize";
    document.body.style.userSelect = "none";
    e.preventDefault();
  });

  document.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const wRect = workspace.getBoundingClientRect();
    const newW = Math.max(
      240,
      Math.min(wRect.width - 240, e.clientX - wRect.left),
    );
    editorPanel.style.width = newW + "px";
    editorPanel.style.flex = "none";
  });

  document.addEventListener("mouseup", () => {
    if (!dragging) return;
    dragging = false;
    resizer.classList.remove("dragging");
    document.body.style.cursor = "";
    document.body.style.userSelect = "";
    Object.values(editors).forEach((ed) => ed.refresh());
  });
})();

// ── PREVIEW SIZE INDICATOR ─────────────────
(function initSizeObserver() {
  const preview = document.getElementById("preview");
  const sizeLabel = document.getElementById("previewSize");
  const ro = new ResizeObserver((entries) => {
    for (const e of entries) {
      const { width, height } = e.contentRect;
      sizeLabel.textContent = `${Math.round(width)} × ${Math.round(height)}`;
    }
  });
  ro.observe(preview);
})();

// ── TOAST ──────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}
